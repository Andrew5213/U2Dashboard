# Arquivo NOVO e independente: nao edite nenhuma config existente do Nginx.
# Troque SEU_SUBDOMINIO pelo dominio real antes de ativar. O certbot acrescenta o
# bloco 443 e o redirecionamento HTTP -> HTTPS sozinho.
server {
    listen 80;
    server_name SEU_SUBDOMINIO;

    # Upload de PDFs em /documentacoes aceita ate 50 MB
    client_max_body_size 55m;

    # SSE do dashboard: sem buffer e com timeout longo, senao o stream cai
    location /dashboard/stream {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Geracao de PDF e chat com IA podem passar de 60s
        proxy_read_timeout 180s;
    }
}
